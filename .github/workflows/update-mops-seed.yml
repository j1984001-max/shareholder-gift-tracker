name: Update MOPS notice seed cache

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Stock codes or mixed text. Leave empty to scan candidates."
        required: false
        default: ""
      limit:
        description: "Maximum records to update when codes is empty."
        required: false
        default: "60"
      reparse_limit:
        description: "Maximum cached notices to second-pass parse after updating."
        required: false
        default: "60"
      skip_existing:
        description: "Skip stocks that are already in the seed cache."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "20 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: write

jobs:
  update-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-chi-tra \
            tesseract-ocr-eng

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update seed cache
        shell: bash
        env:
          MOPS_FETCH_ENGINE: "auto"
          HTTP_REQUEST_DELAY_MIN_MS: "3000"
          HTTP_REQUEST_DELAY_MAX_MS: "7000"
        run: |
          set -euo pipefail
          CODES="${{ github.event.inputs.codes || '' }}"
          LIMIT="${{ github.event.inputs.limit || '60' }}"
          REPARSE_LIMIT="${{ github.event.inputs.reparse_limit || '60' }}"
          SKIP_EXISTING="${{ github.event.inputs.skip_existing || 'true' }}"
          WATCHLIST_TOTAL=$(python -c 'from pathlib import Path; lines=Path("data/mops_seed_watchlist.txt").read_text(encoding="utf-8").splitlines(); print(sum(1 for line in lines if line.strip() and not line.lstrip().startswith("#")) or 1)')
          ROTATE_OFFSET=0
          REPARSE_OFFSET=0

          run_mops_update() {
            set +e
            python tools/update_mops_seed.py "$@"
            status=$?
            set -e
            if [[ "$status" == "2" ]]; then
              echo "MOPS appears rate-limited; continuing with official-site fallback."
              return 0
            fi
            return "$status"
          }

          if [[ -n "$CODES" ]]; then
            run_mops_update "$CODES" \
              --official-pdf-sources data/official_notice_sources.json \
              --prefer-mops \
              --force \
              --sleep 3
            python tools/discover_official_notices.py "$CODES" \
              --sources-file data/official_notice_sources.json \
              --scan-cache-file data/official_site_scan_cache.json \
              --max-pages-per-company 12 \
              --skip-cached-pickup \
              --update-seed \
              --sleep 0.6
            python tools/reparse_notice_cache.py "$CODES" \
              --only-missing-pickup \
              --include-current \
              --limit "$REPARSE_LIMIT" \
              --sleep 1 \
              --save-every 20 \
              --only-write-changed \
              --exit-zero-on-partial
          else
            ROTATE_OFFSET=$(( (${GITHUB_RUN_NUMBER:-0} * LIMIT) % WATCHLIST_TOTAL ))
            REPARSE_OFFSET=$(( (${GITHUB_RUN_NUMBER:-0} * REPARSE_LIMIT) % WATCHLIST_TOTAL ))
            EXTRA_ARGS=(
              --watchlist-file data/mops_seed_watchlist.txt
              --official-pdf-sources data/official_notice_sources.json
              --remote-requested-url https://shareholder-gift-tracker.onrender.com/api/requested-codes
              --limit "$LIMIT"
              --prefer-mops
              --rotate-offset "$ROTATE_OFFSET"
              --sleep 3
            )
            if [[ "$SKIP_EXISTING" == "true" ]]; then
              EXTRA_ARGS+=(--skip-existing)
            else
              EXTRA_ARGS+=(--force)
            fi
            run_mops_update "${EXTRA_ARGS[@]}"

            python tools/discover_official_notices.py \
              --watchlist-file data/mops_seed_watchlist.txt \
              --sources-file data/official_notice_sources.json \
              --scan-cache-file data/official_site_scan_cache.json \
              --limit "$LIMIT" \
              --max-pages-per-company 10 \
              --skip-cached-pickup \
              --skip-recent-attempt-hours 168 \
              --rotate-offset "$ROTATE_OFFSET" \
              --update-seed \
              --sleep 0.6

            python tools/reparse_notice_cache.py \
              --only-missing-pickup \
              --include-current \
              --limit "$REPARSE_LIMIT" \
              --rotate-offset "$REPARSE_OFFSET" \
              --sleep 1 \
              --save-every 20 \
              --only-write-changed \
              --exit-zero-on-partial
          fi
          python tools/build_lookup_snapshot.py --watchlist-file data/mops_seed_watchlist.txt

      - name: Commit seed updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update official notice seed cache"
          file_pattern: data/mops_notice_seed_cache.json data/official_notice_sources.json data/official_site_scan_cache.json data/lookup_snapshot.json
