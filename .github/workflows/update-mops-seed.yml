name: Update MOPS notice seed cache

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Stock codes or mixed text. Leave empty to scan candidates."
        required: false
        default: ""
      limit:
        description: "Maximum records to update when codes is empty."
        required: false
        default: "30"
      skip_existing:
        description: "Skip stocks that are already in the seed cache."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

jobs:
  update-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update seed cache
        shell: bash
        run: |
          set -euo pipefail
          CODES="${{ github.event.inputs.codes || '' }}"
          LIMIT="${{ github.event.inputs.limit || '120' }}"
          SKIP_EXISTING="${{ github.event.inputs.skip_existing || 'true' }}"

          if [[ -n "$CODES" ]]; then
            python tools/update_mops_seed.py "$CODES" --force --sleep 3
          else
            EXTRA_ARGS=(
              --watchlist-file data/mops_seed_watchlist.txt
              --remote-requested-url https://shareholder-gift-tracker.onrender.com/api/requested-codes
              --limit "$LIMIT"
              --sleep 3
            )
            if [[ "$SKIP_EXISTING" == "true" ]]; then
              EXTRA_ARGS+=(--skip-existing)
            else
              EXTRA_ARGS+=(--force)
            fi
            python tools/update_mops_seed.py "${EXTRA_ARGS[@]}"
          fi

      - name: Commit seed updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update MOPS notice seed cache"
          file_pattern: data/mops_notice_seed_cache.json
