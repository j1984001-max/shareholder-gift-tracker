<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股東會紀念品追蹤器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260523-6">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Shareholder Gift Desk</p>
        <h1>股東會紀念品追蹤器</h1>
        <p class="lead">批次查詢紀念品、股東會日期、電子投票領取時間、地點與攜帶文件。</p>
      </div>
      <div class="header-actions">
        <div class="meta-pill">
          <span>本次更新</span>
          <strong id="updatedAtText">尚未查詢</strong>
        </div>
        <div class="meta-pill wide">
          <span>補資料進度</span>
          <strong id="noticeProgressText">讀取中...</strong>
        </div>
      </div>
    </header>

    <main class="dashboard-grid">
      <aside class="control-card">
        <div class="panel-head">
          <div>
            <h2>批次匯入</h2>
            <p>可貼上 `台泥（1101）嘉泥（1103）` 這類連續文字。</p>
          </div>
          <span class="code-counter" id="codeCounter">0 檔</span>
        </div>

        <label class="field-block">
          <span>股票代號</span>
          <textarea id="codesInput" rows="10" placeholder="例如：2317, 2409, 3037&#10;9938&#10;2006&#10;或：台泥（1101）嘉泥（1103）"></textarea>
        </label>

        <div class="button-row">
          <button id="lookupBtn" class="primary-btn" type="button">查詢最新資料</button>
          <button id="saveWatchlistBtn" class="ghost-btn" type="button">儲存 watchlist</button>
        </div>

        <div class="button-row compact">
          <button id="loadSampleBtn" class="chip-btn" type="button">載入範例</button>
          <button id="clearBtn" class="chip-btn" type="button">清空</button>
        </div>

        <section class="watch-card">
          <h3>工作流</h3>
          <p>先查詢，再用上方摘要抓出缺電投日期的標的；下載 Excel 可接著編輯。</p>
        </section>
      </aside>

      <section class="content-stack">
        <section class="summary-strip" id="summaryStrip"></section>

        <section class="surface-card">
          <div class="panel-head">
            <div>
              <h2>查詢結果</h2>
              <p id="statusText">尚未查詢資料</p>
            </div>
            <div class="toolbar">
              <button id="exportBtn" class="ghost-btn" type="button">下載 Excel</button>
              <button id="refreshBtn" class="ghost-btn" type="button">重新整理</button>
            </div>
          </div>

          <div class="result-tools">
            <div class="filter-tabs" role="tablist" aria-label="結果篩選">
              <button class="filter-tab active" type="button" data-filter="all">全部</button>
              <button class="filter-tab" type="button" data-filter="pickup">有電投日期</button>
              <button class="filter-tab" type="button" data-filter="missingPickup">缺電投日期</button>
              <button class="filter-tab" type="button" data-filter="notice">有通知書</button>
              <button class="filter-tab" type="button" data-filter="changed">有變更</button>
            </div>
            <label class="result-search">
              <span>搜尋</span>
              <input id="resultSearchInput" type="search" placeholder="代號、公司、股代、地點">
            </label>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>代號 / 公司</th>
                  <th>狀態</th>
                  <th>紀念品</th>
                  <th>關鍵日期</th>
                  <th>電子投票 / 領取 / 股代 / 來源</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <tr>
                  <td colspan="5" class="empty-cell">貼上股票代號後開始查詢</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </div>

  <template id="summaryCardTemplate">
    <article class="summary-card">
      <span class="summary-label"></span>
      <strong class="summary-value"></strong>
      <p class="summary-note"></p>
    </article>
  </template>

  <script src="./app.js?v=20260523-6"></script>
</body>
</html>
